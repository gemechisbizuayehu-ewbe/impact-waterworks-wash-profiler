description: <!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--navy:#0b1c2c;--gold:#d4af37;--paper:#f5f5f0;--ink:#1a1a1a;--muted:#657383;--line:#dce2e7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,sans-serif}.top{background:var(--navy);color:white;padding:25px max(20px,calc((100% - 1100px)/2));border-bottom:5px solid var(--gold)}.top h1{margin:0;font-size:clamp(23px,4vw,34px)}.top p{margin:5px 0 0;color:#e2e7eb}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #0b1c2c0b}.hidden{display:none!important}.row{display:flex;gap:14px;flex-wrap:wrap}.field{flex:1;min-width:220px}label{font-weight:700;display:block;margin-bottom:6px}select,button,input[type=text]{font:inherit;padding:11px;border:1px solid #b9c4ce;border-radius:8px;background:white;width:100%}button{cursor:pointer;font-weight:700;background:var(--navy);color:white;border:0;width:auto;padding:11px 17px}button.secondary{background:#e8edf1;color:var(--navy)}button.gold{background:var(--gold);color:var(--navy)}.domain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.domain{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:10px}.domain input{margin-top:5px}.muted{color:var(--muted);font-size:14px}.progress{height:8px;background:#e8edf1;border-radius:9px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:var(--gold);width:0}.item{border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.code{font-size:12px;font-weight:bold;letter-spacing:.04em;color:#596b7c}.statement{font-size:17px;margin:7px 0 14px}.rating-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.rating{border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center}.rating input{display:block;margin:0 auto 5px}.rating label{font-size:13px;margin:0;cursor:pointer}.na{display:flex;gap:8px;align-items:center;margin:14px 0;font-weight:600}.na input{width:auto}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{padding:15px;border-radius:10px;background:#f1f4f6}.metric strong{font-size:26px;display:block;color:var(--navy)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f1f4f6}.chartrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.chartbox{border:1px solid var(--line);padding:14px;border-radius:10px}canvas{width:100%;height:190px}.notice{border-left:4px solid var(--gold);background:#fff9e6;padding:12px 14px;margin:12px 0}.pill{display:inline-block;border-radius:20px;padding:3px 9px;background:#e8edf1;font-size:12px}.error{color:#a22}.footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:600px){.rating-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rating:last-child{grid-column:span 2}.card{padding:15px}th,td{padding:7px}}
</style></head><body><header class="top"><h1>Impact WaterWorks</h1><p>WASH Competency Profiler · approximately 20 minutes · no account required</p></header><main class="wrap">
<section id="welcome" class="card"><h2>Build your competency profile</h2><p>Reflect on your current competence and the importance of each competency to your role. Your responses are saved in this browser on this device.</p><div class="notice"><b>Source-data verification:</b> The supplied workbook declares 219 items (66, 28, 14, 38, 30, 43), but the provided XLSX visibly exposes only a partial set of competency statements. This prototype will never invent missing statements. The question bank should be completed and verified before official use.</div><div class="row"><button class="gold" onclick="startNew()">Start a new assessment</button><button class="secondary" onclick="resume()">Resume saved assessment</button><button class="secondary" onclick="showResults()">View saved results</button></div><p id="savedInfo" class="muted"></p></section>
<section id="setup" class="card hidden"><h2>Assessment setup</h2><label>What is the purpose of this assessment?</label><div class="row"><label class="rating"><input type="radio" name="purpose" value="current" checked>Assess my current role</label><label class="rating"><input type="radio" name="purpose" value="future">Plan for future goals</label></div><h3>Choose one or more domains</h3><div id="domains" class="domain-grid"></div><p class="muted">Expected item counts reflect the workbook's domain totals. Actual question counts depend on the verified Question_Bank sheet.</p><div class="actions"><button class="secondary" onclick="home()">Back</button><button class="gold" onclick="begin()">Begin assessment</button></div></section>
<section id="assessment" class="card hidden"><div class="row" style="justify-content:space-between;align-items:center"><div><span id="stepLabel" class="pill"></span><h2 id="domainTitle"></h2></div><button class="secondary" onclick="saveAndHome()">Save & exit</button></div><div class="progress"><span id="progressBar"></span></div><p id="progressText" class="muted"></p><div id="items"></div><div class="actions"><button class="secondary" onclick="previousPage()">Previous</button><button class="gold" onclick="nextPage()">Save & continue</button></div></section>
<section id="results" class="card hidden"><div class="row" style="justify-content:space-between;align-items:center"><div><h2>Assessment results</h2><p id="resultPurpose" class="muted"></p></div><button class="secondary" onclick="home()">Home</button></div><div id="summaryNotice" class="notice"></div><div id="metrics" class="metric-grid"></div><h3>Domain summary</h3><div style="overflow:auto"><table><thead><tr><th>Domain</th><th>Assessed</th><th>Avg competence</th><th>Avg importance</th><th>Priority score</th></tr></thead><tbody id="summaryRows"></tbody></table></div><h3>Competency profiles</h3><div id="charts" class="chartrow"></div><div class="actions"><button onclick="downloadResults()">Export results CSV</button><button class="secondary" onclick="setupAgain()">Change domains / continue</button><button class="secondary" onclick="clearSaved()">Clear saved assessment</button></div></section>
</main><div class="footer">WASH Competency Profiler · responses remain in local browser storage; clearing browser data removes them.</div>
<script>
const STORAGE='impactWaterWorksWASHProfiler.v1';let app={domains:[],items:[],scales:{}},state=null,page=0,perPage=8;
function callServer(){google.script.run.withSuccessHandler(d=>{app=d;renderDomains();const s=load();document.getElementById('savedInfo').textContent=s?'Saved assessment found on this browser. Last saved '+new Date(s.updated).toLocaleString()+'.':'';}).withFailureHandler(e=>{document.getElementById('savedInfo').textContent='Unable to load Question_Bank: '+e.message;}).getAppData();}
function load(){try{return JSON.parse(localStorage.getItem(STORAGE));}catch(e){return null}}function persist(){state.updated=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(state));}
function show(id){['welcome','setup','assessment','results'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}function home(){show('welcome')}
function renderDomains(){document.getElementById('domains').innerHTML=app.domains.map((d,i)=>`<label class="domain"><input type="checkbox" value="${esc(d.name)}" ${i===0?'checked':''}><span><b>${esc(d.name)}</b><br><span class="muted">${d.expected} expected items</span><br><span class="muted">${esc(d.description)}</span></span></label>`).join('')}
function startNew(){state={id:'WASH-'+Date.now(),purpose:'current',selected:[],responses:{},created:new Date().toISOString(),updated:new Date().toISOString()};document.querySelector('input[name="purpose"][value="current"]').checked=true;show('setup')}
function setupAgain(){show('setup');renderDomains();if(state){document.querySelector(`input[name="purpose"][value="${state.purpose}"]`).checked=true;document.querySelectorAll('#domains input').forEach(x=>x.checked=state.selected.includes(x.value));}}
function begin(){const selected=[...document.querySelectorAll('#domains input:checked')].map(x=>x.value);if(!selected.length){alert('Select at least one domain.');return}state=state||{id:'WASH-'+Date.now(),responses:{},created:new Date().toISOString()};state.purpose=document.querySelector('input[name="purpose"]:checked').value;state.selected=selected;state.items=app.items.filter(x=>selected.includes(x.domain)).map(x=>x.id);state.responses=state.responses||{};page=0;persist();renderPage();show('assessment')}
function resume(){state=load();if(!state){alert('No saved assessment was found in this browser.');return}if(!state.selected||!state.selected.length){show('setup');return}if(!state.items)state.items=app.items.filter(x=>state.selected.includes(x.domain)).map(x=>x.id);page=0;renderPage();show('assessment')}
function activeItems(){return (state.items||[]).map(id=>app.items.find(x=>x.id===id)).filter(Boolean)}
function renderPage(){const all=activeItems(),pages=Math.max(1,Math.ceil(all.length/perPage));page=Math.max(0,Math.min(page,pages-1));const chunk=all.slice(page*perPage,(page+1)*perPage);document.getElementById('stepLabel').textContent=`Page ${page+1} of ${pages}`;document.getElementById('domainTitle').textContent='Competency assessment';const done=all.filter(x=>{let r=state.responses[x.id];return r&&(r.na||r.competence&&r.importance)}).length;document.getElementById('progressBar').style.width=(all.length?done/all.length*100:0)+'%';document.getElementById('progressText').textContent=`${done} of ${all.length} items completed or marked not applicable`;
 document.getElementById('items').innerHTML=chunk.map(x=>{let r=state.responses[x.id]||{};return `<article class="item"><div class="code">${esc(x.code||x.id)} · ${esc(x.domain)}</div><div class="statement">${esc(x.text)}</div><label class="na"><input type="checkbox" ${r.na?'checked':''} onchange="setNA('${x.id}',this.checked)"> Not applicable to my role</label><div class="muted">My current competence level</div><div class="rating-grid">${app.scales.proficiency.map((v,i)=>`<div class="rating"><label><input type="radio" name="c-${x.id}" value="${i+1}" ${Number(r.competence)===i+1?'checked':''} ${r.na?'disabled':''} onchange="setRate('${x.id}','competence',${i+1})">${v}</label></div>`).join('')}</div><div style="height:12px"></div><div class="muted">Importance to my role</div><div class="rating-grid">${app.scales.importance.map((v,i)=>`<div class="rating"><label><input type="radio" name="i-${x.id}" value="${i+1}" ${Number(r.importance)===i+1?'checked':''} ${r.na?'disabled':''} onchange="setRate('${x.id}','importance',${i+1})">${v}</label></div>`).join('')}</div></article>`}).join('')||'<p>No question statements are available for the selected domains. Add verified rows to Question_Bank.</p>';
}
function setRate(id,k,v){state.responses[id]=state.responses[id]||{};state.responses[id][k]=v;state.responses[id].na=false;persist();updateProgressOnly()}
function setNA(id,val){state.responses[id]=state.responses[id]||{};state.responses[id].na=val;if(val){delete state.responses[id].competence;delete state.responses[id].importance}persist();renderPage()}
function updateProgressOnly(){const all=activeItems(),done=all.filter(x=>{let r=state.responses[x.id];return r&&(r.na||(r.competence&&r.importance))}).length;document.getElementById('progressBar').style.width=(all.length?done/all.length*100:0)+'%';document.getElementById('progressText').textContent=`${done} of ${all.length} items completed or marked not applicable`}
function nextPage(){const all=activeItems();if(page<Math.ceil(all.length/perPage)-1){page++;persist();renderPage();window.scrollTo(0,0)}else{persist();showResults()}}function previousPage(){if(page>0){page--;renderPage()}else show('setup')}function saveAndHome(){persist();home()}
function calc(){return app.domains.filter(d=>state.selected.includes(d.name)).map(d=>{let rows=activeItems().filter(x=>x.domain===d.name).map(x=>state.responses[x.id]).filter(r=>r&&!r.na&&Number(r.competence)>0&&Number(r.importance)>0);let c=rows.length?rows.reduce((a,r)=>a+Number(r.competence),0)/rows.length:null;let im=rows.length?rows.reduce((a,r)=>a+Number(r.importance),0)/rows.length:null;return {...d,count:rows.length,competence:c,importance:im,priority:c===null?null:im*(6-c)}})}
function showResults(){state=state||load();if(!state){alert('No assessment found.');return}persist();const sums=calc();let rated=sums.filter(x=>x.count),total=rated.reduce((n,x)=>n+x.count,0),weighted=rated.reduce((n,x)=>n+x.competence*x.count,0),avg=total?weighted/total:null,na=activeItems().filter(x=>state.responses[x.id]?.na).length;document.getElementById('resultPurpose').textContent=state.purpose==='future'?'Purpose: Plan for future goals':'Purpose: Assess my current role';document.getElementById('summaryNotice').innerHTML=`Scoring includes only items with both competence and importance ratings. Not-applicable items are excluded. Priority score = average importance × (6 − average competence). ${activeItems().length} source-visible items available across selected domains; the workbook specifies 219 items overall.`;document.getElementById('metrics').innerHTML=`<div class="metric"><span>Applicable assessed items</span><strong>${total}</strong></div><div class="metric"><span>Average competence</span><strong>${avg===null?'—':avg.toFixed(2)+' / 5'}</strong></div><div class="metric"><span>Marked not applicable</span><strong>${na}</strong></div><div class="metric"><span>Domains with ratings</span><strong>${rated.length}</strong></div>`;document.getElementById('summaryRows').innerHTML=sums.map(x=>`<tr><td>${esc(x.name)}<br><span class="muted">${x.count}/${x.expected} expected</span></td><td>${x.count}</td><td>${x.competence===null?'—':x.competence.toFixed(2)+'/5'}</td><td>${x.importance===null?'—':x.importance.toFixed(2)+'/5'}</td><td>${x.priority===null?'—':x.priority.toFixed(2)}</td></tr>`).join('');document.getElementById('charts').innerHTML=sums.filter(x=>x.count>0).map((x,i)=>`<div class="chartbox"><b>${esc(x.name)}</b><canvas id="chart${i}" width="400" height="190"></canvas><p class="muted">Competence ${x.competence.toFixed(2)}/5 · Importance ${x.importance.toFixed(2)}/5</p></div>`).join('');sums.filter(x=>x.count>0).forEach((x,i)=>drawChart('chart'+i,x));show('results')}
function drawChart(id,d){let c=document.getElementById(id),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let labels=['Competence','Importance'],vals=[d.competence,d.importance];ctx.font='14px Arial';labels.forEach((l,i)=>{let y=45+i*65;ctx.fillStyle='#1a1a1a';ctx.fillText(l,8,y);ctx.fillStyle='#e7ebef';ctx.fillRect(115,y-17,240,23);ctx.fillStyle=i?'#d4af37':'#0b1c2c';ctx.fillRect(115,y-17,240*vals[i]/5,23);ctx.fillStyle='#1a1a1a';ctx.fillText(vals[i].toFixed(2),365,y)});ctx.fillStyle='#657383';ctx.fillText('Scale: 0–5',115,175)}
function downloadResults(){let rows=[['Domain','Assessed_Items','Average_Competence','Average_Importance','Priority_Score','Expected_Items']];calc().forEach(x=>rows.push([x.name,x.count,x.competence??'',x.importance??'',x.priority??'',x.expected]));rows.push([],['Item_ID','Domain','Code','Statement','Competence','Importance','Not_Applicable']);activeItems().forEach(x=>{let r=state.responses[x.id]||{};rows.push([x.id,x.domain,x.code||'',x.text,r.competence||'',r.importance||'',!!r.na])});let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='wash-competency-results.csv';a.click();URL.revokeObjectURL(a.href)}
function clearSaved(){if(confirm('Delete the saved assessment from this browser?')){localStorage.removeItem(STORAGE);state=null;home();document.getElementById('savedInfo').textContent=''}}function setupAgain(){show('setup');renderDomains();if(state){document.querySelector(`input[name="purpose"][value="${state.purpose}"]`).checked=true;document.querySelectorAll('#domains input').forEach(x=>x.checked=state.selected.includes(x.value));}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
callServer();
</script></body></html>
